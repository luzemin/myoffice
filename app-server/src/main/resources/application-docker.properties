# =====================================================================
# Docker profile - used when SPRING_PROFILES_ACTIVE=docker.
# All hostnames here resolve via the docker compose network.
# =====================================================================

# ---- Datasource (MySQL container) ----
spring.datasource.url=jdbc:mysql://mysql:3306/myoffice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:myoffice123}

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---- OnlyOffice DocumentServer ----
# This URL is embedded into the editor HTML and loaded by the BROWSER, so it
# must be reachable from the host (not the docker network). The default points
# at the host port the docker-compose file publishes.
onlyoffice.server.url=${ONLYOFFICE_PUBLIC_URL:http://localhost:8088/}
onlyoffice.server.security.key=${ONLYOFFICE_JWT_SECRET:my_jwt_secret}

# ---- Internal callback base URL ----
# DocumentServer (in its own container) must reach the backend through the
# docker network, NOT through the browser-facing localhost. URLs returned to
# DocumentServer (file download / save callback) will be prefixed with this.
myoffice.internal-base-url=${MYOFFICE_INTERNAL_BASE_URL:http://app-server:80}

# ---- Bootstrap schema + seed data on startup ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:data/schema-docker.sql
spring.sql.init.data-locations=classpath:data/data.sql
spring.sql.init.continue-on-error=true
