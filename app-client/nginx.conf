server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (matches Spring Boot multipart settings).
    client_max_body_size 0;

    # SPA fallback: any unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: backend REST API.
    location /api/ {
        proxy_pass http://app-server:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse proxy: OnlyOffice editor (Thymeleaf-rendered HTML page).
    location /editor {
        proxy_pass http://app-server:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: actuator-style health probe (if any).
    location /health {
        proxy_pass http://app-server:80;
        proxy_set_header Host $host;
    }
}
